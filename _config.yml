# Site Settings
baseurl: ""

# Features Setting
# Turn subpages on or off
publications: False
presentations: False
blog: False

# Language of the website
lang: en

# Search engine optimization settings
title: Ordatun Jannat
tagline: A jekyll theme for academic portfolios
description: The demonstration page for the Grape Academic Theme, a jekyll theme for academic portfolios based on the Grape Theme.
author: Ordatun Jannat
twitter:
  username: chrjabs
  card: A jekyll theme for academic portfolios
logo: /assets/img/smile.png
social:
  name: Ordatun Jannat
  links:
    - https://twitter.com/chrjabs
    - https://github.com/chrjabs
locale: en_GB

# Page Settings
theme_settings:
  title: Grape Academic Theme

  experience_title: EXPERIENCE
  interests_title: RESEARCH INTERESTS
  skills_title: SKILLS
  awards_title: AWARDS
  projects_title: PROJECTS
  recentpubs_title: RECENT PUBLICATIONS

# Pagination
paginate: 5
paginate_path: "blog/page:num"

# Build Settings
sass:
  sass_dir: _sass
  style: :compressed
plugins: ['jekyll-paginate', 'jekyll/scholar', 'jekyll-seo-tag']
bootstrap:
  assets: true

# Bibliography settings
scholar:
  bibliography: publications.bib
  bibliography_template: pubstemplate
  style: apa
  locale: en
  last_name: Me
  first_name: [Myself, M.]
  sort_by: year,month
  order: descending,ascending

# Collection of hub pages
collections:
  hubs:
    output: true
    permalink: /:name

filtered_bibtex_keywords: [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website] # Filter out certain bibtex entry keywords used internally from the bib output

academicons:
  version: "1.9.5"
  integrity: "sha384-IAnhEDrYZnLsYcVzowpizdxXTHFovW5/CkZObGfY2QuaCKaQpvLCjj45LGb4Q/yE"
fontawesome:
  version: "7.3.1"
  integrity: "sha384-qrALq7+6jBOZIQsNnT6xGkMDru64qD6uTlDra39xrt2SoXl4pO3FX6Roz/RpR/BS"
jquery:
  version: "3.6.0"
  integrity: "sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="

# Exclude files that are irrelevant to the webpage
exclude: ["flake.nix", "flake.lock", "README.md", "LICENSE.txt", "grape-theme.gemspec"]
